services:
  embedding_api:
    image: angeluz07/embedding-api:0.0.1 # use local if exists
    build:
      context: .
    container_name: embedding_api
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src:z
    command: ["fastapi", "dev", "src/main.py", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1.5G
        reservations:
          cpus: "1"
          memory: 0.5G
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: qdrant_vector_db
    restart: always
    ports:
      - "6333:6333" # API REST y Web Dashboard
      - "6334:6334" # gRPC (por si lo necesitas más adelante)
    environment:
      - QDRANT__SERVICE__ENABLE_PROFILING=true
    volumes:
      - ./.qdrant_data:/qdrant/storage:z
    deploy:
      resources:
        limits:
          cpus: "0.50" # Máximo 50% de un núcleo de CPU
          memory: 512M # Máximo 512MB de RAM (ideal para tus colecciones de testing)
        reservations:
          memory: 128M # Garantiza al menos 128MB
